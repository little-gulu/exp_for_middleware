# 中间件基础设施编排（Go 服务计划 2-4 以宿主机 go run 方式开发，计划 5 才进 compose）
# 内存预算：全栈 ≤12GB，本机 32G 留 20G+ 给其他进程（spec §13）
# 端口避让：本机 3306/6379 已被占用，demo 用 13306/16379（容器内端口不变）
services:
  mysql:
    image: mysql:8.0.36
    container_name: demo-mysql
    env_file: .env
    environment:
      MYSQL_DATABASE: demo
    ports:
      - "13306:3306"
    command: >
      --server-id=1
      --binlog-format=ROW
      --binlog-row-image=FULL
      --log-bin=mysql-bin
      --innodb-buffer-pool-size=2147483648
    # ↑ server-id=1 + binlog ROW：CDC 捕获的前提（改错=bug S3）
    # ↑ buffer pool 2G：内存预算内的性能底线
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.2.0
    container_name: demo-kafka
    ports:
      - "9094:9094"          # 宿主机访问走 9094（EXTERNAL）
    environment:
      # KRaft 单节点：同时是 broker 和 controller（生产应拆开，见 docs/diagrams 架构图）
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # 双 listener：容器内服务用 kafka:9092，宿主机工具用 localhost:9094
      # 二者地址不能互换——配错即 bug S1（advertised.listeners 是最经典的 Kafka 部署坑）
      - KAFKA_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      # 关自动建 topic：强制显式创建（教学 kafka-topics 用法）
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      # 内部主题（__consumer_offsets 等）的副本因子：默认 3，单节点必须显式降 1，
      # 否则内部主题创建失败、消费组 offset 提交卡死（今天实际踩到的坑）
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      # 显式钉死数据目录到挂载的卷：镜像默认写 /tmp/kafka-logs（容器层，重建即丢）
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_HEAP_OPTS=-Xms512m -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data   # KRaft 元数据 + 消息日志；不挂卷则重建容器=丢数据
    healthcheck:
      # apache/kafka 镜像的 CLI 在 /opt/kafka/bin 且不在 PATH，需全路径；Docker 镜像保留 .sh 后缀
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  connect:
    image: debezium/connect:2.5
    container_name: demo-connect
    ports:
      - "8083:8083"          # Kafka Connect REST 管理端口
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=connect-cluster
      - CONFIG_STORAGE_TOPIC=connect-configs
      - OFFSET_STORAGE_TOPIC=connect-offsets
      - STATUS_STORAGE_TOPIC=connect-status
      # 单节点 Kafka，副本因子只能 1（生产是 3，这是 demo 的显式降级点）
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - KAFKA_HEAP_OPTS=-Xmx1g
    depends_on:
      kafka: { condition: service_healthy }
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: demo-es
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # 学习环境关安全认证，生产必须开
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.9-alpine
    container_name: demo-redis
    ports:
      - "16379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 900 1 --save 300 10
    # ↑ 内存上限 + 淘汰策略：防内存打满（bug R7 的正确基线）
    # ↑ AOF + RDB 双开：重启不丢榜单/位图/幂等键（bug S6 的正确基线）
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  es-data:
  redis-data:
  kafka-data:
